<!doctype html><html lang="en"><head><script src="/vexaro-session.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>VEXARO Notifications — Community Alerts</title><meta name="description" content="View your VEXARO community notifications, follows, likes, comments and account alerts."><meta name="robots" content="noindex, nofollow"><style>:root{--bg:#050505;--panel:#0d0d10;--text:#f5f5f5;--muted:#888;--accent:#e10600;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(225,6,0,.15),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(800px,calc(100% - 24px));margin:auto}.top{padding:18px 0;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.brand{font-weight:1000;letter-spacing:.15em}.brand span{color:var(--accent)}.hero{padding:50px 0 25px}.kicker{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:.2em}.hero h1{font-size:clamp(44px,8vw,76px);margin:10px 0}.btn{border:1px solid var(--line);background:#101014;color:#fff;border-radius:10px;padding:11px 14px;font-weight:900}.list{display:grid;gap:9px;margin-bottom:70px}.item{padding:15px;border:1px solid var(--line);border-radius:12px;background:#0b0b0d}.unread{border-color:rgba(225,6,0,.45)}.type{font-size:9px;color:#e10600;font-weight:900;letter-spacing:.14em}.title{font-weight:900;margin-top:5px}.body{color:#aaa;font-size:12px;line-height:1.5;margin-top:5px}.meta{color:#666;font-size:10px;margin-top:7px}.empty{padding:25px;text-align:center;color:#777}</style></head><body><header class="top"><div class="wrap"><a class="brand" href="/">VEXARO <span>NOTIFICATIONS</span></a></div></header><main class="wrap"><section class="hero"><div class="kicker">VEXARO / ACCOUNT</div><h1>YOUR <span style="color:#e10600">ALERTS.</span></h1><button class="btn" id="read">MARK ALL READ</button></section><div id="preferences" class="item" style="margin-bottom:14px"><div class="title">Notification preferences</div><div class="body"><label><input type="checkbox" id="pushPref"> Push alerts</label> &nbsp; <label><input type="checkbox" id="emailPref"> Email alerts</label> &nbsp; <label><input type="checkbox" id="communityPref"> Community alerts</label> &nbsp; <label><input type="checkbox" id="moderationPref"> Account alerts</label> <button class="btn" id="savePrefs">SAVE</button><span id="prefMsg" class="meta"></span></div></div><div id="activity" class="list"></div><div id="list" class="list"><div class="empty">Checking your account…</div></div></main><script>const list=document.getElementById('list');const activity=document.getElementById('activity');const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function boot(){const sb=supabase.createClient(window.VEXARO_SUPABASE_URL,window.VEXARO_SUPABASE_KEY);const {data:{session}}=await sb.auth.getSession();if(!session){list.innerHTML='<div class="empty">Sign in to view notifications.</div>';return}
const pref=await sb.from('member_notification_preferences').select('*').eq('user_id',session.user.id).maybeSingle();const pv=pref.data||{push_enabled:true,email_enabled:true,community_enabled:true,moderation_enabled:true};document.getElementById('pushPref').checked=pv.push_enabled;document.getElementById('emailPref').checked=pv.email_enabled;document.getElementById('communityPref').checked=pv.community_enabled;document.getElementById('moderationPref').checked=pv.moderation_enabled;
const ah=await sb.from('member_activity_history').select('activity_type,description,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(30);activity.innerHTML='<div class="title">Recent account activity</div>'+(ah.data?.length?ah.data.map(x=>'<div class="item"><div class="type">'+esc(x.activity_type)+'</div><div class="body">'+esc(x.description)+'</div><div class="meta">'+new Date(x.created_at).toLocaleString('en-GB')+'</div></div>').join(''):'<div class="empty">No activity recorded yet.</div>');const r=await sb.from('notifications').select('id,type,title,body,link,read_at,created_at').order('created_at',{ascending:false}).limit(100);if(r.error){list.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}list.innerHTML=r.data?.length?r.data.map(n=>'<a class="item '+(!n.read_at?'unread':'')+'" href="'+(n.link||'community.html')+'" data-id="'+n.id+'"><div class="type">'+esc(n.type)+'</div><div class="title">'+esc(n.title)+'</div><div class="body">'+esc(n.body)+'</div><div class="meta">'+new Date(n.created_at).toLocaleString('en-GB')+(!n.read_at?' · NEW':'')+'</div></a>').join(''):'<div class="empty">No notifications yet.</div>';list.querySelectorAll('[data-id]').forEach(a=>a.addEventListener('click',async()=>{await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',a.dataset.id)}))}document.getElementById('savePrefs').addEventListener('click',async()=>{const {data:{session}}=await supabase.createClient(window.VEXARO_SUPABASE_URL,window.VEXARO_SUPABASE_KEY).auth.getSession();if(!session)return;const sb=supabase.createClient(window.VEXARO_SUPABASE_URL,window.VEXARO_SUPABASE_KEY);const x=await sb.from('member_notification_preferences').upsert({user_id:session.user.id,push_enabled:document.getElementById('pushPref').checked,email_enabled:document.getElementById('emailPref').checked,community_enabled:document.getElementById('communityPref').checked,moderation_enabled:document.getElementById('moderationPref').checked,updated_at:new Date().toISOString()});document.getElementById('prefMsg').textContent=x.error?x.error.message:'Saved';});document.getElementById('read').addEventListener('click',async()=>{const sb=supabase.createClient(window.VEXARO_SUPABASE_URL,window.VEXARO_SUPABASE_KEY);const {data:{session}}=await sb.auth.getSession();if(session){await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',session.user.id).is('read_at',null);boot()}});boot();</script></body></html>

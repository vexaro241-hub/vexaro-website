<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEXARO HEALTH DASHBOARD</title><style>body{margin:0;background:#050505;color:#fff;font:14px system-ui;padding:24px}.wrap{max-width:900px;margin:auto}.card{background:#101014;border:1px solid #222;border-radius:12px;padding:16px;margin:10px 0}.ok{color:#6fda9b}.bad{color:#ff6b63}.muted{color:#999}button{background:#e10600;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:800}</style></head><body><main class="wrap"><h1>VEXARO HEALTH DASHBOARD.</h1><p class="muted">Automated public endpoint health checks.</p><button id="run">RUN CHECKS</button><div id="out"></div></main><script>const urls=[["Website","https://vexaro-website.vexaro241.workers.dev/health"],["Members","https://vexaro-members.vexaro241.workers.dev/health.html"],["Admin","https://vexaro-admin.vexaro241.workers.dev/"],["Twitch OAuth","https://vexaro-twitch-auth.vexaro241.workers.dev/"],["YouTube OAuth","https://vexaro-youtube-auth.vexaro241.workers.dev/"]];async function run(){out.innerHTML="";for(const [name,url] of urls){const t=performance.now();try{const r=await fetch(url,{cache:"no-store",mode:"cors"});const ms=Math.round(performance.now()-t);out.insertAdjacentHTML("beforeend",'<div class="card"><strong>'+name+'</strong> <span class="'+(r.ok?"ok":"bad")+'">'+r.status+(r.ok?" OK":" FAIL")+'</span><div class="muted">'+ms+' ms</div></div>')}catch(e){out.insertAdjacentHTML("beforeend",'<div class="card"><strong>'+name+'</strong> <span class="bad">UNREACHABLE</span></div>')}}}document.getElementById("run").onclick=run;run();</script></body></html>

<!doctype html><html lang="en"><head><script src="/vexaro-session.js"></script><script src="vexaro-analytics.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEXARO Profile</title><style>:root{--bg:#050505;--panel:#0d0d10;--text:#f5f5f5;--muted:#999;--accent:#e10600;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(225,6,0,.16),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.top{padding:16px 0;border-bottom:1px solid var(--line)}.top a{color:#fff;text-decoration:none;font-weight:1000;letter-spacing:.15em}.card{margin:35px 0;background:linear-gradient(145deg,#111115,#080809);border:1px solid var(--line);border-radius:16px;padding:24px}.badge{display:inline-block;border:1px solid rgba(225,6,0,.45);color:#e10600;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:1000;margin-left:7px}.muted{color:var(--muted)}.post{padding:16px 0;border-top:1px solid var(--line);white-space:pre-wrap;line-height:1.5}.btn{display:inline-block;border:1px solid var(--line);border-radius:9px;background:#101014;color:#fff;padding:10px 13px;font-weight:900;font-size:10px;text-transform:uppercase;text-decoration:none;margin-top:12px}</style></head><body><header class="top"><div class="wrap"><a href="/">VEXARO</a></div></header><main class="wrap"><section class="card"><div id="profile">Loading profile…</div></section><section class="card"><h2>Posts</h2><div id="posts">Loading…</div></section></main><script>
const sb=window.supabase.createClient(window.VEXARO_SUPABASE_URL,window.VEXARO_SUPABASE_KEY),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const slug=new URLSearchParams(location.search).get('id');
async function load(){if(!slug){$('profile').textContent='Profile not found.';return}const p=await sb.from('profile_identities').select('id,username,display_name,bio,avatar_url,identity_type,can_post').eq('slug',slug).maybeSingle();if(p.error||!p.data){$('profile').textContent='Profile not found.';return}const x=p.data;$('profile').innerHTML='<h1>'+esc(x.display_name)+(x.identity_type==='admin'?'<span class="badge">ADMIN</span>':'')+'</h1><p class="muted">@'+esc(x.username)+'</p><p>'+esc(x.bio)+'</p><a class="btn" href="community.html">Open community</a>';const r=await sb.from('posts').select('id,body,created_at').eq('identity_id',x.id).order('created_at',{ascending:false}).limit(50);if(r.error){$('posts').textContent=r.error.message;return}$('posts').innerHTML=r.data?.length?r.data.map(v=>'<article class="post"><div class="muted">'+new Date(v.created_at).toLocaleString()+'</div>'+esc(v.body)+'</article>').join(''):'<div class="muted">No posts yet.</div>'}load();
</script></body></html>

<!doctype html><html lang="en"><head><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>VEXARO Search — Community</title><meta name="description" content="Search the VEXARO gaming community for members, posts, loadouts and share Warzone setups."><meta name="robots" content="index, follow"><link rel="canonical" href="https://vexaroofficial.com/search.html"><style>:root{--bg:#050505;--panel:#0d0d10;--text:#f5f5f5;--muted:#888;--accent:#e10600;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(225,6,0,.15),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 24px));margin:auto}.top{padding:18px 0;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.brand{font-weight:1000;letter-spacing:.15em}.brand span{color:var(--accent)}.hero{padding:50px 0 25px}.kicker{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:.2em}.hero h1{font-size:clamp(44px,8vw,76px);margin:10px 0}.search{display:flex;gap:8px}.search input{appearance:none;-webkit-appearance:none;width:100%;flex:1;min-width:0;background:#09090b;color:#fff;border:1px solid var(--line);border-radius:11px;padding:15px;font-size:16px}.btn{border:1px solid var(--line);background:#101014;color:#fff;border-radius:10px;padding:13px 16px;font-weight:900}.btn.accent{background:linear-gradient(135deg,#e10600,#e10600)}.results{margin:18px 0 70px;display:grid;gap:10px}.item{padding:15px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#111115,#080809)}.type{font-size:9px;color:#e10600;letter-spacing:.14em;font-weight:900}.title{font-weight:900;margin-top:5px}.meta{color:#777;font-size:11px;margin-top:5px}.body{color:#bbb;font-size:12px;line-height:1.45;margin-top:8px}.empty{padding:25px;text-align:center;color:#777}</style><link rel="stylesheet" href="/vexaro-platform.css?v=20261009-2"></head><body><header class="top"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><a class="brand" href="/" aria-label="VEXARO Home">VEXARO <span>SEARCH</span></a><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="/" aria-label="Return to VEXARO website home">VEXARO HOME</a><a class="btn" href="/">HOME</a><a class="btn" href="/clips.html">CLIPS</a><a class="btn" href="/loadouts.html">LOADOUTS</a><a class="btn" href="/settings.html">SETTINGS</a><a class="btn" href="/community.html">COMMUNITY</a></div></div></header><main class="wrap"><section class="hero"><div class="kicker">FIND YOUR NEXT BUILD</div><h1>SEARCH <span style="color:#e10600">VEXARO.</span></h1><div class="search"><input id="q" maxlength="80" placeholder="Members, posts, loadouts, settings..."><button class="btn accent" id="go">SEARCH</button></div></section><div id="results" class="results"><div class="empty">Search the VEXARO community.</div></div></main><script>const q=document.getElementById('q'),out=document.getElementById('results');const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function search(){const term=q.value.trim();if(term.length<2){out.innerHTML='<div class="empty">Type at least 2 characters.</div>';return}out.innerHTML='<div class="empty">Searching…</div>';const sb=window.vexaroSupabase;const like='%'+term.replace(/[%_]/g,'')+'%';const [p,posts,l,s]=await Promise.all([sb.from('public_profiles').select('id,username,display_name,bio').or('username.ilike.'+like+',display_name.ilike.'+like+',bio.ilike.'+like).limit(20),sb.from('posts').select('id,body,created_at').ilike('body',like).order('created_at',{ascending:false}).limit(20),sb.from('loadouts').select('id,title,weapon,category,notes').or('title.ilike.'+like+',weapon.ilike.'+like+',category.ilike.'+like+',notes.ilike.'+like).limit(20),sb.from('settings_posts').select('id,title,setting_type,body').or('title.ilike.'+like+',body.ilike.'+like+',setting_type.ilike.'+like).limit(20)]);const rows=[];(p.data||[]).forEach(x=>rows.push({type:'MEMBER',title:x.display_name||x.username,meta:'@'+x.username,body:x.bio,href:'community.html'}));(posts.data||[]).forEach(x=>rows.push({type:'POST',title:'Community post',meta:new Date(x.created_at).toLocaleDateString('en-GB'),body:x.body,href:'community.html'}));(l.data||[]).forEach(x=>rows.push({type:'LOADOUT',title:x.title,meta:x.weapon+' · '+x.category,body:x.notes,href:'community.html'}));(s.data||[]).forEach(x=>rows.push({type:'SETTING',title:x.title,meta:x.setting_type,body:x.body,href:'community.html'}));out.innerHTML=rows.length?rows.map(x=>'<a class="item" href="'+x.href+'"><div class="type">'+esc(x.type)+'</div><div class="title">'+esc(x.title)+'</div><div class="meta">'+esc(x.meta)+'</div><div class="body">'+esc(x.body)+'</div></a>').join(''):'<div class="empty">No results found.</div>'}document.getElementById('go').addEventListener('click',search);q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});</script></body></html>

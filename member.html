<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.svg"><title>Member — VEXARO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
:root{--bg:#050505;--panel:#0d0d10;--text:#f5f5f5;--muted:#92929b;--red:#e10600;--red2:#ff3028;--line:rgba(255,255,255,.09);--max:1180px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(225,6,0,.18),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:1000;letter-spacing:.16em}.brand b{color:var(--red2)}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{font-size:10px;font-weight:1000;letter-spacing:.1em;text-transform:uppercase;color:#aaa;padding:9px}.hero{padding:60px 0 30px}.kicker{font-size:10px;color:#ff4038;font-weight:1000;letter-spacing:.2em;text-transform:uppercase}.profile{display:flex;gap:18px;align-items:center;margin-top:14px}.avatar{width:86px;height:86px;border-radius:18px;object-fit:cover;background:#17171b;display:grid;place-items:center;color:#ff4b45;font-size:30px;font-weight:1000;border:1px solid var(--line)}h1{font-size:clamp(42px,8vw,82px);line-height:.85;letter-spacing:-.06em;margin:0;font-style:italic}.handle{color:#777;margin-top:8px}.badge{display:inline-block;border:1px solid rgba(225,6,0,.45);color:#ff4b45;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:1000;margin-left:7px}.bio{max-width:700px;color:#aaa;line-height:1.6;margin:18px 0}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:10px 12px;border:1px solid var(--line);background:#0b0b0d;color:#bbb;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.section{padding:30px 0 60px}.section h2{font-size:34px;font-style:italic;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#111116,#080809);padding:18px;overflow:hidden}.card img,.card video{width:100%;max-height:300px;object-fit:cover;border-radius:10px;margin-bottom:13px}.card h3{margin:0 0 6px;font-size:22px;font-style:italic}.meta{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em}.body{color:#ccc;line-height:1.55;white-space:pre-wrap;margin-top:10px}.pill{display:inline-block;margin:5px 5px 0 0;padding:7px 8px;background:#09090b;border:1px solid var(--line);color:#aaa;font-size:9px}.empty{padding:30px;border:1px dashed var(--line);color:#777;text-align:center}.error{color:#ff817b}.media-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.footer{padding:30px 0;color:#666;font-size:10px;letter-spacing:.1em;text-transform:uppercase}@media(max-width:800px){.nav{align-items:flex-start;flex-wrap:wrap;padding:12px 0}.links{width:100%;overflow:auto}.grid{grid-template-columns:1fr}.profile{align-items:flex-start}.avatar{width:70px;height:70px}}
</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">VEX<b>ARO</b></a><nav class="links"><a href="community.html">Community</a><a href="loadouts.html">Loadouts</a><a href="clips.html">Clips</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">VEXARO / MEMBER PROFILE</div><div id="profile">Loading member...</div></section><section class="section"><h2>LOADOUTS.</h2><div id="loadouts" class="grid"><div class="empty">Loading builds...</div></div></section><section class="section"><h2>POSTS & MEDIA.</h2><div id="posts" class="grid"><div class="empty">Loading posts...</div></div></section><section class="section"><h2>SETTINGS.</h2><div id="settings" class="grid"><div class="empty">Loading settings...</div></div></section></main><footer class="footer"><div class="wrap">VEXARO · MEMBER PROFILE</div></footer><script>
const sb=window.supabase.createClient(window.VEXARO_SUPABASE_URL,window.VEXARO_SUPABASE_KEY);const q=new URLSearchParams(location.search);const id=q.get('user');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pills(arr){return(Array.isArray(arr)?arr:[]).map(x=>'<span class="pill">'+esc(typeof x==='string'?x:(x.name?x.name+': '+x.value:''))+'</span>').join('')}
async function load(){if(!id){$('profile').innerHTML='<div class="error">No member selected.</div>';return}const [p,l,s,posts]=await Promise.all([sb.from('profiles').select('id,username,display_name,bio,avatar_url,role,created_at').eq('id',id).maybeSingle(),sb.from('loadouts').select('id,user_id,title,weapon,category,attachments,perks,equipment,notes,image_url,created_at').eq('user_id',id).order('created_at',{ascending:false}).limit(50),sb.from('settings_posts').select('id,title,setting_type,body,created_at').eq('user_id',id).order('created_at',{ascending:false}).limit(50),sb.from('posts').select('id,body,created_at,post_media(id,media_type,public_url),post_likes(user_id),comments(id)').eq('user_id',id).order('created_at',{ascending:false}).limit(30)]);if(p.error||!p.data){$('profile').innerHTML='<div class="error">Member not found.</div>';return}const x=p.data;const avatar=x.avatar_url?'<img class="avatar" src="'+esc(x.avatar_url)+'" alt="Profile avatar">':'<div class="avatar">'+esc((x.display_name||'V').slice(0,1).toUpperCase())+'</div>';$('profile').innerHTML='<div class="profile">'+avatar+'<div><h1>'+esc(x.display_name||'VEXARO Member')+'</h1><div class="handle">@'+esc(x.username||'member')+(String(x.role||'').toLowerCase()==='admin'?'<span class="badge">ADMIN</span>':'')+'</div></div></div><div class="bio">'+esc(x.bio||'VEXARO community member.')+'</div><div class="stats"><span class="stat">'+(l.data?.length||0)+' loadouts</span><span class="stat">'+(posts.data?.length||0)+' posts</span><span class="stat">'+(s.data?.length||0)+' settings</span></div>';
$('loadouts').innerHTML=l.data?.length?l.data.map(v=>'<article class="card">'+(v.image_url?'<img loading="lazy" src="'+esc(v.image_url)+'" alt="'+esc(v.weapon)+'">':'')+'<div class="meta">'+esc(v.category||'Warzone')+'</div><h3>'+esc(v.title)+'</h3><b>'+esc(v.weapon)+'</b><div>'+pills(v.attachments)+'</div><div>'+pills(v.perks)+'</div><div>'+pills(v.equipment)+'</div><div class="body">'+esc(v.notes||'')+'</div></article>').join(''):'<div class="empty">No loadouts shared yet.</div>';
$('posts').innerHTML=posts.data?.length?posts.data.map(v=>'<article class="card"><div class="meta">'+new Date(v.created_at).toLocaleString()+'</div><div class="body">'+esc(v.body)+'</div>'+((v.post_media||[]).length?'<div class="media-grid" style="margin-top:12px">'+v.post_media.map(m=>m.media_type==='video'?'<video controls playsinline src="'+esc(m.public_url)+'"></video>':'<img loading="lazy" src="'+esc(m.public_url)+'" alt="Community upload">').join('')+'</div>':'')+'</article>').join(''):'<div class="empty">No posts shared yet.</div>';
$('settings').innerHTML=s.data?.length?s.data.map(v=>'<article class="card"><div class="meta">'+esc(v.setting_type)+' · '+new Date(v.created_at).toLocaleDateString()+'</div><h3>'+esc(v.title)+'</h3><div class="body">'+esc(v.body)+'</div></article>').join(''):'<div class="empty">No settings shared yet.</div>'}
load();
</script></body></html>

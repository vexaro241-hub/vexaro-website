{border:1px solid var(--line);background:linear-gradient(145deg,#111116,#080809);padding:18px;overflow:hidden}.card img,.card video{width:100%;max-height:300px;object-fit:cover;border-radius:10px;margin-bottom:13px}.card h3{margin:0 0 6px;font-size:22px;font-style:italic}.meta{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em}.body{color:#ccc;line-height:1.55;white-space:pre-wrap;margin-top:10px}.pill{display:inline-block;margin:5px 5px 0 0;padding:7px 8px;background:#09090b;border:1px solid var(--line);color:#aaa;font-size:9px}.empty{padding:30px;border:1px dashed var(--line);color:#777;text-align:center}.error{color:#e10600}.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.profile-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.profile-nav a{padding:9px 11px;border:1px solid var(--line);border-radius:9px;color:#aaa;font-size:10px;font-weight:900;text-transform:uppercase}.profile-nav a:hover{color:#fff;border-color:rgba(225,6,0,.45)}.follow-btn{border:1px solid rgba(225,6,0,.55);background:linear-gradient(135deg,#e10600,#e10600);color:#fff;padding:11px 15px;border-radius:10px;font-weight:1000;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.follow-btn.following{background:#111114;border-color:rgba(255,255,255,.14);color:#fff}.follow-btn:disabled{opacity:.55;cursor:not-allowed}.profile-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.profile-meta span{border:1px solid var(--line);background:#0b0b0d;padding:8px 10px;color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.06em}.card-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}.engagement{color:#777;font-size:10px}.member-link{color:#fff;text-decoration:none}.member-link:visited{color:#fff}.member-link:hover{color:var(--#e106002)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.section-head .meta{margin:0}.media-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.footer{padding:30px 0;color:#666;font-size:10px;letter-spacing:.1em;text-transform:uppercase}@media(max-width:800px){.nav{align-items:flex-start;flex-wrap:wrap;padding:12px 0}.links{width:100%;overflow:auto}.grid{grid-template-columns:1fr}.profile{align-items:flex-start}.avatar{width:70px;height:70px}}

</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/">VEX<b>ARO</b></a><nav class="links"><a href="community.html">Community</a><a href="loadouts.html">Loadouts</a><a href="clips.html">Clips</a><a href="community.html">Members</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">VEXARO / MEMBER PROFILE</div><div id="profile">Loading member...</div></section><section class="section"><h2>LOADOUTS.</h2><div id="loadouts" class="grid"><div class="empty">Loading builds...</div></div></section><section class="section"><h2>POSTS & MEDIA.</h2><div id="posts" class="grid"><div class="empty">Loading posts...</div></div></section><section class="section"><h2>SETTINGS.</h2><div id="settings" class="grid"><div class="empty">Loading settings...</div></div></section></main><footer class="footer"><div class="wrap">VEXARO · MEMBER PROFILE</div></footer><script>
const sb=window.supabase.createClient(window.VEXARO_SUPABASE_URL,window.VEXARO_SUPABASE_KEY);const q=new URLSearchParams(location.search);const id=q.get('user');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pills(arr){return(Array.isArray(arr)?arr:[]).map(x=>'<span class="pill">'+esc(typeof x==='string'?x:(x.name?x.name+': '+x.value:''))+'</span>').join('')}
async function load(){
  if(!id){$('profile').innerHTML='<div class="error">No member selected.</div>';return}
  const viewer=(await sb.auth.getSession()).data.session?.user||null;
  const [p,l,s,posts,followers,following,viewerFollow]=await Promise.all([
    sb.from('profiles').select('id,username,display_name,bio,avatar_url,role,created_at').eq('id',id).maybeSingle(),
    sb.from('loadouts').select('id,user_id,title,weapon,category,attachments,perks,equipment,notes,image_url,created_at').eq('user_id',id).order('created_at',{ascending:false}).limit(50),
    sb.from('settings_posts').select('id,title,setting_type,body,created_at').eq('user_id',id).order('created_at',{ascending:false}).limit(50),
    sb.from('posts').select('id,body,created_at,post_media(id,media_type,public_url),post_likes(user_id),comments(id)').eq('user_id',id).order('created_at',{ascending:false}).limit(50),
    sb.from('follows').select('follower_id',{count:'exact',head:true}).eq('following_id',id),
    sb.from('follows').select('following_id',{count:'exact',head:true}).eq('follower_id',id),
    viewer&&viewer.id!==id?sb.from('follows').select('follower_id').eq('follower_id',viewer.id).eq('following_id',id).maybeSingle():Promise.resolve({data:null,error:null})
  ]);
  if(p.error||!p.data){$('profile').innerHTML='<div class="error">Member not found.</div>';return}
  const x=p.data;
  const loadoutCount=l.data?.length||0,postCount=posts.data?.length||0,settingCount=s.data?.length||0;
  const likesReceived=(posts.data||[]).#e10600uce((n,v)=>n+(v.post_likes?.length||0),0);
  const followerCount=followers.count||0,followingCount=following.count||0;
  const isAdmin=String(x.role||'').toLowerCase()==='admin';
  const isOwner=viewer?.id===id;
  const isFollowing=!!viewerFollow?.data;
  const avatar=x.avatar_url?'<img class="avatar" src="'+esc(x.avatar_url)+'" alt="Profile avatar">':'<div class="avatar">'+esc((x.display_name||'V').slice(0,1).toUpperCase())+'</div>';
  const followAction=viewer&&!isOwner?'<button id="followBtn" class="follow-btn'+(isFollowing?' following':'')+'" onclick="toggleFollow()">'+(isFollowing?'Following':'Follow')+'</button>':'';
  const ownerAction=isOwner?'<a class="follow-btn" href="community.html">Edit profile</a>':'';
  $('profile').innerHTML='<div class="profile">'+avatar+'<div><h1>'+esc(x.display_name||'VEXARO Member')+'</h1><div class="handle">@'+esc(x.username||'member')+(isAdmin?'<span class="badge">ADMIN</span>':'')+'</div></div></div><div class="bio">'+esc(x.bio||'VEXARO community member.')+'</div><div class="profile-meta"><span>'+followerCount+' follower'+(followerCount===1?'':'s')+'</span><span>'+followingCount+' following</span><span>Member since '+new Date(x.created_at).toLocaleDateString()+'</span></div><div class="profile-actions">'+followAction+ownerAction+'</div><div class="profile-nav"><a href="community.html">Community</a><a href="loadouts.html">Arsenal</a><button class="follow-btn following" onclick="shareProfile()">Share profile</button></div>';
  $('loadouts').innerHTML=loadoutCount?l.data.map(v=>'<article class="card">'+(v.image_url?'<img loading="lazy" src="'+esc(v.image_url)+'" alt="'+esc(v.weapon)+'">':'')+'<div class="meta">'+esc(v.category||'Warzone')+' · '+new Date(v.created_at).toLocaleDateString()+'</div><h3>'+esc(v.title)+'</h3><b>'+esc(v.weapon)+'</b><div>'+pills(v.attachments)+'</div><div>'+pills(v.perks)+'</div><div>'+pills(v.equipment)+'</div><div class="body">'+esc(v.notes||'')+'</div></article>').join(''):'<div class="empty">No loadouts sha#e10600 yet.</div>';
  $('posts').innerHTML=postCount?posts.data.map(v=>{const media=(v.post_media||[]).map(m=>m.media_type==='video'?'<video controls playsinline preload="metadata" src="'+esc(m.public_url)+'"></video>':'<img loading="lazy" src="'+esc(m.public_url)+'" alt="Community upload">').join('');return '<article class="card"><div class="meta">'+new Date(v.created_at).toLocaleString()+'</div><div class="body">'+esc(v.body)+'</div>'+(media?'<div class="media-grid">'+media+'</div>':'')+'<div class="card-actions"><span class="engagement">♥ '+(v.post_likes?.length||0)+' likes · 💬 '+(v.comments?.length||0)+' comments</span><a class="btn mini" href="community.html">Open community</a></div></article>'}).join(''):'<div class="empty">No posts sha#e10600 yet.</div>';
  $('settings').innerHTML=settingCount?s.data.map(v=>'<article class="card"><div class="meta">'+esc(v.setting_type)+' · '+new Date(v.created_at).toLocaleDateString()+'</div><h3>'+esc(v.title)+'</h3><div class="body">'+esc(v.body)+'</div></article>').join(''):'<div class="empty">No settings sha#e10600 yet.</div>';
}
async function shareProfile(){const url=location.href;if(navigator.share){try{await navigator.share({title:'VEXARO Profile',url})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Profile link copied.')}}
async function toggleFollow(){
  const viewer=(await sb.auth.getSession()).data.session?.user||null;
  if(!viewer){location.href='community.html?signin=1';return}
  if(viewer.id===id)return;
  const btn=$('followBtn');if(btn)btn.disabled=true;
  const current=await sb.from('follows').select('follower_id').eq('follower_id',viewer.id).eq('following_id',id).maybeSingle();
  let error=null;
  if(current.data) error=(await sb.from('follows').delete().eq('follower_id',viewer.id).eq('following_id',id)).error;
  else error=(await sb.from('follows').insert({follower_id:viewer.id,following_id:id})).error;
  if(error)alert(error.message);
  await load();
}
load();

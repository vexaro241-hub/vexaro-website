name: VEXARO Accessibility Checks
on:
  push:
    branches: ["production"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a11y:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for this commit to reach the live Worker
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            live="$(curl -fsS --max-time 10 https://vexaro-website.vexaro241.workers.dev/deploy-version.txt 2>/dev/null || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live deployment marker matches $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Live deployment marker did not reach production in time." >&2
          exit 1

      - name: Accessibility smoke
        run: |
          set -euo pipefail
          npx --yes @axe-core/cli https://vexaro-website.vexaro241.workers.dev/ --exit
          npx --yes @axe-core/cli https://vexaro-members.vexaro241.workers.dev/ --exit
          npx --yes @axe-core/cli https://vexaro-admin.vexaro241.workers.dev/ --exit
          echo "VEXARO accessibility checks PASS"

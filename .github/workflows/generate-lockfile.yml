name: Generate real Bun lockfile
on:
  push:
    branches:
      - speed/real-lockfile
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --lockfile-only
      - run: |
          rm .github/workflows/generate-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock .github/workflows/generate-lockfile.yml
          git commit -m "Add real Bun lockfile for build caching"
          git push

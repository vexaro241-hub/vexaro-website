name: VEXARO Fast QA Gate

on:
  push:
    branches: ["production"]
  workflow_dispatch:

concurrency:
  group: vexaro-fast-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production source
        run: node scripts/validate-vexaro.mjs

      - name: HTTP smoke tests and performance budget
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://vexaro-website.vexaro241.workers.dev/"
            "https://vexaro-members.vexaro241.workers.dev/"
            "https://vexaro-admin.vexaro241.workers.dev/"
            "https://vexaro-members.vexaro241.workers.dev/community.html"
            "https://vexaro-members.vexaro241.workers.dev/settings.html"
            "https://vexaro-members.vexaro241.workers.dev/notifications.html"
          )
          : > /tmp/vexaro-fast-qa.txt
          for u in "${urls[@]}"; do
            line=$(curl -L -sS -o /tmp/body -w "%{http_code} %{time_total}" --max-time 15 "$u")
            code=${line%% *}
            time=${line#* }
            echo "$code $time $u" | tee -a /tmp/vexaro-fast-qa.txt
            test "$code" = "200"
            awk -v t="$time" 'BEGIN { exit !(t < 5) }'
          done

      - name: Link monitor
        run: python3 qa/check_links.py

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexaro-fast-qa-evidence
          path: /tmp/vexaro-fast-qa.txt
          if-no-files-found: ignore

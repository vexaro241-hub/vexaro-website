name: VEXARO Browser QA

on:
  push:
    branches: ["main", "production"]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production deployment
        if: github.ref_name == 'production'
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            live="$(curl -fsS --max-time 10 https://vexaro-website.vexaro241.workers.dev/deploy-version.txt 2>/dev/null || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live deployment marker matches $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Live deployment marker did not reach production in time." >&2
          exit 1

      - name: Install QA runner
        run: npm install

      - name: Install browser QA binary
        run: npm install agent-browser@0.38.2 --no-save

      - name: Install browser
        run: npx agent-browser install --with-deps

      - name: Run VEXARO browser checks
        run: npm run qa:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexaro-browser-qa-${{ github.run_number }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

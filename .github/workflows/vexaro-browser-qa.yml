name: VEXARO Browser QA

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node qa/vexaro-cross-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexaro-browser-qa-${{ github.run_number }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14


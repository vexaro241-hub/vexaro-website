name: VEXARO Browser QA

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install QA runner
        run: npm install

      - name: Install browser
        run: npx agent-browser install --with-deps

      - name: Run VEXARO browser checks
        run: npm run qa:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexaro-browser-qa-${{ github.run_number }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

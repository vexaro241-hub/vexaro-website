name: VEXARO Browser QA

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Run production browser checks
        run: |
          set -euo pipefail
          npm install
          npm install agent-browser@0.38.2 --no-save
          npx agent-browser install --with-deps
          npm run qa:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexaro-browser-qa-${{ github.run_number }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14

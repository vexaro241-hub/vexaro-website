name: VEXARO Security Checks

on:
  push:
    branches: [main, production]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          patterns='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}'
          if grep -RIE --exclude-dir=.git --exclude-dir=.github --exclude='*.md' --exclude='*.svg' "$patterns" .; then
            echo "Potential credential material found."
            exit 1
          fi
          echo "No known credential patterns found."
      - name: Validate critical workflow files
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/vexaro-lifeline.yml
          test -s .github/workflows/vexaro-fast-qa.yml
          test -s .github/workflows/vexaro-production.yml
          echo "Critical automation files present."

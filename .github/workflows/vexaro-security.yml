name: VEXARO Security Checks

on:
  push:
    branches: [main, production]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          patterns='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}'
          if git grep -nEI --binary-files=without-match -- ':!*.md' ':!*.svg' ':!.github/**' "$patterns"; then
            echo "Potential credential material found."
            exit 1
          fi
          echo "No configured credential patterns found in tracked source files."

      - name: Check tracked files for private-key extensions
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git ls-files '*.pem' '*.key' 'id_rsa' 'id_ed25519')"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "Potential private-key file found."
            exit 1
          fi
          echo "No tracked private-key files found."

name: VEXARO Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node qa/platform-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vexaro-browser-qa-report
          path: |
            qa-results/
            qa-results-home-*.png
          if-no-files-found: ignore
          retention-days: 14

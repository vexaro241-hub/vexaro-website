name: VEXARO Main Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site structure
        run: node scripts/validate-vexaro.mjs
      - name: Check required safety files
        run: |
          test -f .github/dependabot.yml
          test -f docs/RELEASE-CHECKLIST.md
          test -f docs/DISASTER-RECOVERY.md
          test -f docs/SECURITY-RUNBOOK.md
      - name: Check for accidental secrets
        run: |
          if grep -RIE --exclude-dir=.git --exclude='*.md' --exclude='*.svg' '(service_role|BEGIN PRIVATE KEY|aws_secret_access_key|ghp_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]{20,})' .; then
            echo "Potential secret material found."
            exit 1
          fi

name: VEXARO Main Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate site structure
        run: node scripts/validate-vexaro.mjs
      - name: Run static HTML and asset audit
        run: node scripts/vexaro-static-js-audit.mjs
      - name: Check required future-ready files
        run: |
          test -f .github/dependabot.yml
          test -f docs/RELEASE-CHECKLIST.md
          test -f docs/DISASTER-RECOVERY.md
          test -f docs/SECURITY-RUNBOOK.md
          test -f docs/OPERATIONS.md
          test -f docs/FEATURE-FLAGS.md
          test -f docs/RELEASE-FREEZE.md
          test -f scripts/site-audit.mjs
          test -f robots.txt
          test -f sitemap.xml

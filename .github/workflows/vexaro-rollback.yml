name: VEXARO Rollback Control
on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker to roll back"
        required: true
        type: choice
        options: [vexaro-website, vexaro-members, vexaro-admin]
      version_id:
        description: "Cloudflare version ID to promote"
        required: true
        type: string
permissions:
  contents: read
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Promote selected known-good Cloudflare version
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ inputs.worker }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER/deployments" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data "{\"strategy\":\"percentage\",\"versions\":[{\"version_id\":\"$VERSION_ID\",\"percentage\":100}]}" > /tmp/rollback.json
          grep -q '"success":true' /tmp/rollback.json

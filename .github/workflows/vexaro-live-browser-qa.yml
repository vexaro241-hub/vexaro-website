name: VEXARO Live Responsive Browser QA

on:
  push:
    branches:
      - release/vexaro-master-batch-2026-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-qa]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check browser QA script syntax
        run: node --check qa/vexaro-responsive-qa.mjs
      - name: Run production responsive checks
        run: node qa/vexaro-responsive-qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexaro-live-responsive-qa
          path: qa-results/
          if-no-files-found: ignore
          retention-days: 7

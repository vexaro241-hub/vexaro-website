name: VEXARO Preview Gate

on:
  push:
    branches-ignore: [main, production]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate VEXARO site structure
        run: node scripts/validate-vexaro.mjs
      - name: Check for legacy sign-in route
        run: |
          if grep -R "community.html?signin=1" --exclude-dir=.git .; then
            echo "Legacy sign-in route found."
            exit 1
          fi

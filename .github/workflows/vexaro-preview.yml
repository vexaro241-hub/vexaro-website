name: VEXARO Preview Validation
on:
  pull_request:
    branches: ["production"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview source
        run: |
          set -euo pipefail
          test -s index.html
          test -s community.html
          test -s admin-app.html
          node scripts/validate-vexaro.mjs
          echo "VEXARO preview validation PASS"

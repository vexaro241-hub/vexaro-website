name: VEXARO Preview Gate

on:
  push:
    branches-ignore: [main, production]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate VEXARO site structure
        run: node scripts/validate-vexaro.mjs

name: VEXARO Preview Gate

on:
  push:
    branches-ignore: [main, production]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate VEXARO site structure
        run: node scripts/validate-vexaro.mjs
      - name: Check production Worker syntax
        run: node --check worker/vexaro-production.mjs

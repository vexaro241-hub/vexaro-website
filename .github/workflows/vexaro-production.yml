name: VEXARO Production Guard

on:
  push:
    branches: [production]

concurrency:
  group: vexaro-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production branch
        run: node scripts/validate-vexaro.mjs

name: VEXARO Production Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vexaro-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deployment tooling
        run: npm install --no-audit --no-fund
      - name: Validate source
        run: node scripts/validate-vexaro.mjs
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 50b698b841707f4c5dfca8023d156283
        run: npx wrangler deploy --config wrangler.production.jsonc --message "VEXARO production deployment"

name: VEXARO Lifeline

on:
  push:
    branches: [production]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifeline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check public services and critical routes
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://vexaro-website.vexaro241.workers.dev/"
            "https://vexaro-members.vexaro241.workers.dev/"
            "https://vexaro-admin.vexaro241.workers.dev/"
            "https://vexaro-members.vexaro241.workers.dev/community.html"
            "https://vexaro-members.vexaro241.workers.dev/settings.html"
            "https://vexaro-members.vexaro241.workers.dev/notifications.html"
            "https://vexaro-website.vexaro241.workers.dev/health"
          )
          : > /tmp/lifeline-report.txt
          for url in "${urls[@]}"; do
            line=$(curl -L -sS -o /tmp/lifeline-body -w "%{http_code} %{time_total}" --max-time 15 "$url")
            code=${line%% *}
            time=${line#* }
            echo "$code $time $url" | tee -a /tmp/lifeline-report.txt
            test "$code" = "200"
            if [[ "$url" == */health ]]; then
              grep -q '"status":"ok"' /tmp/lifeline-body
            else
              grep -qi "VEXARO" /tmp/lifeline-body
            fi
            awk -v t="$time" 'BEGIN { exit !(t < 5) }'
          done

      - name: Check security headers
        shell: bash
        run: |
          set -euo pipefail
          # Members/Admin are strict enforcement targets. The static Website Worker is
          # reported separately because its asset response path does not consume _headers.
          for url in             "https://vexaro-members.vexaro241.workers.dev/"             "https://vexaro-admin.vexaro241.workers.dev/"; do
            headers=$(curl -L -sS -I --max-time 15 "$url")
            echo "$headers"
            echo "$headers" | grep -qi '^x-content-type-options: nosniff'
            echo "$headers" | grep -qi '^referrer-policy:'
          done
          website_headers=$(curl -L -sS -I --max-time 15 "https://vexaro-website.vexaro241.workers.dev/" || true)
          if echo "$website_headers" | grep -qi '^x-content-type-options: nosniff' &&
             echo "$website_headers" | grep -qi '^referrer-policy:'; then
            echo "Website security headers: PASS"
          else
            echo "Website security headers: WARNING - static asset response path is not applying _headers"
          fi

      - name: Check internal links
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/check_links.py

      - name: Upload lifeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexaro-lifeline-report
          path: /tmp/lifeline-report.txt
          if-no-files-found: ignore
